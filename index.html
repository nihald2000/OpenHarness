<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenHarness</title>
    <meta name="description" content="Chat with OpenHarness agents, protocols, apps, plan, skills and subagents." />
    <meta property="og:title" content="OpenHarness" />
    <meta property="og:description" content="Chat with OpenHarness agents, protocols, apps, plan, skills and subagents." />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      try {
        var t = localStorage.getItem('oh-theme');
        var d = document.documentElement;
        if (t === 'dark') {
          d.classList.add('dark');
          d.classList.remove('light');
          d.style.colorScheme = 'dark';
        } else {
          d.classList.add('light');
          d.classList.remove('dark');
          d.style.colorScheme = 'light';
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
