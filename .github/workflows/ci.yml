name: CI

on:
  push:
  pull_request:

jobs:
  build-and-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3
      - run: bun install --frozen-lockfile
      - run: bun run build:server
      - run: bun run typecheck
      - run: bun run typecheck:server
      - run: bun run build
      - name: Start offline backend
        run: |
          bun run server > /tmp/openharness-server.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:4096/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/openharness-server.log
          exit 1
      - run: bun run eval examples/demo.eval.jsonl
